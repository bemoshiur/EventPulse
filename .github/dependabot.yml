version: 2

updates:
  # ─── npm (pnpm workspace root) ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '03:00'
      timezone: 'Asia/Dhaka'
    open-pull-requests-limit: 10
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Group all devDependency patch+minor bumps into one PR per week-ish.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Group framework patch+minor bumps together so we land Next.js / React
      # bumps as a single coherent change rather than 8 separate PRs.
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
        update-types: [minor, patch]
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'tailwind-merge', 'prettier-plugin-tailwindcss']
        update-types: [minor, patch]
      hono:
        patterns: ['hono', '@hono/*']
        update-types: [minor, patch]
      types:
        patterns: ['@types/*']
        update-types: [minor, patch]
    ignore:
      # CLAUDE.md §1.2 locks the stack. Major bumps of these packages would
      # break documented contracts; they require a playbook update first.
      # Patch + minor still flow through normally. Tracked by gotcha
      # "Dependabot opens majors aggressively on first push" (2026-05-16).
      - dependency-name: 'next'
        update-types: [version-update:semver-major]
      - dependency-name: 'react'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint-config-next'
        update-types: [version-update:semver-major]
      - dependency-name: 'zod'
        update-types: [version-update:semver-major]
      - dependency-name: 'vitest'
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'tailwindcss'
        update-types: [version-update:semver-major]
      - dependency-name: '@tailwindcss/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'tailwind-merge'
        update-types: [version-update:semver-major]
      - dependency-name: 'hono'
        update-types: [version-update:semver-major]
      - dependency-name: '@hono/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'drizzle-orm'
        update-types: [version-update:semver-major]
      - dependency-name: 'drizzle-kit'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
      - dependency-name: 'lucia'
        update-types: [version-update:semver-major]
      - dependency-name: 'arctic'
        update-types: [version-update:semver-major]
      - dependency-name: 'framer-motion'
        update-types: [version-update:semver-major]
      - dependency-name: 'lucide-react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      # pino + pino-pretty: locked by playbook §1.2 (Logging row). Major bumps
      # change the structured-log envelope; not a no-thinking upgrade.
      - dependency-name: 'pino'
        update-types: [version-update:semver-major]
      - dependency-name: 'pino-pretty'
        update-types: [version-update:semver-major]
    # Production deps left UNGROUPED on purpose — every prod-dep upgrade gets
    # its own PR so the changelog is reviewable.

  # ─── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '03:00'
      timezone: 'Asia/Dhaka'
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Action majors usually mean breaking input/output changes; review manually,
      # not via auto-PR.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # ─── Docker (production base images, once they land in /infra) ──────────
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: 'Asia/Dhaka'
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
