name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (commit SHA or tag) to deploy'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Awaiting production-approval reviewer
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - run: echo "Approved by reviewer"

  deploy:
    name: Deploy → production EC2
    needs: approval
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eventpulse.com.bd
    timeout-minutes: 20
    env:
      DEPLOY_REF: ${{ inputs.ref }}
      DEPLOY_ACTOR: ${{ github.actor }}
      PROD_INSTANCE_ID: ${{ secrets.PROD_EC2_INSTANCE_ID }}
    steps:
      - name: Validate ref
        run: |
          # Workflow-dispatch inputs are user-controlled; constrain to git-safe
          # characters before letting it anywhere near the SSM payload.
          if [[ ! "$DEPLOY_REF" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::Invalid ref: $DEPLOY_REF"
            exit 1
          fi
          echo "Validated ref: $DEPLOY_REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_PROD }}
          aws-region: ap-southeast-1
          role-session-name: gh-actions-deploy-prod

      - name: Trigger deploy script via SSM
        id: ssm
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$PROD_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy-prod $DEPLOY_REF" \
            --parameters "commands=[\"sudo -u eventpulse /home/eventpulse/app/infra/deploy/deploy.sh $DEPLOY_REF\"]" \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$PROD_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$PROD_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Smoke test
        run: |
          set -euo pipefail
          for ENDPOINT in \
            "https://eventpulse.com.bd/" \
            "https://app.eventpulse.com.bd/" \
            "https://api.eventpulse.com.bd/health"; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$ENDPOINT" || echo "000")
            echo "$ENDPOINT -> $CODE"
            test "$CODE" = "200"
          done

      - name: Notify Slack
        if: always()
        env:
          STATUS: ${{ job.status }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Production deploy ${{ env.STATUS }} — ${{ env.DEPLOY_REF }} by ${{ env.DEPLOY_ACTOR }}"
