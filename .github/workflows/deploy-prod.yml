name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type "production" exactly to confirm the target environment.'
        required: true
        type: string
      release_tag:
        description: 'Release tag to deploy. Must match ^v\d+\.\d+\.\d+$ (e.g. v0.1.0, v1.4.2).'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  validate-inputs:
    name: Validate typed-input gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Confirm target is "production"
        run: |
          # Free-plan deploy gate: no environment reviewers available, so the typing
          # step IS the deliberate gate (decisions.md 2026-05-16 "GitHub free plan").
          if [[ "$CONFIRM_TARGET" != "production" ]]; then
            echo "::error::confirm_target must be exactly 'production'."
            echo "::error::got: '$CONFIRM_TARGET'"
            exit 1
          fi
          echo "OK: confirm_target=$CONFIRM_TARGET"

      - name: Validate release_tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must match ^v\d+\.\d+\.\d+\$ (e.g. v0.1.0)."
            echo "::error::got: '$RELEASE_TAG'"
            exit 1
          fi
          echo "OK: release_tag=$RELEASE_TAG"

      - name: Verify release_tag exists in repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag is a real git tag
        run: |
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release_tag '$RELEASE_TAG' is not a git tag in this repo."
            echo "::error::Cut the tag first: git tag -a $RELEASE_TAG -m 'release notes'"
            exit 1
          fi
          echo "OK: $RELEASE_TAG is a real tag at $(git rev-parse $RELEASE_TAG)"

  deploy:
    name: Deploy → production EC2
    needs: validate-inputs
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eventpulse.com.bd
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      DEPLOY_ACTOR: ${{ github.actor }}
      PROD_INSTANCE_ID: ${{ secrets.PROD_EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_PROD }}
          aws-region: ap-southeast-1
          role-session-name: gh-actions-deploy-prod

      - name: Trigger deploy script via SSM
        id: ssm
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$PROD_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy-prod $RELEASE_TAG" \
            --parameters "commands=[\"sudo -u eventpulse /home/eventpulse/app/infra/deploy/deploy.sh $RELEASE_TAG\"]" \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          # `aws ssm wait command-executed` only polls ~100s (20×5s), but a
          # build-on-box deploy takes minutes — it would TIME OUT and fail the
          # job even when deploy.sh ultimately SUCCEEDS (observed v0.4.0 cutover,
          # 2026-06-04). Poll get-command-invocation until a terminal status,
          # bounded by the command's own 900s timeout. (gotchas.md "deploy-prod
          # aws-ssm-wait times out on build-on-box deploys → false failure".)
          for _ in $(seq 1 100); do
            ST="$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$PROD_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            echo "ssm command status: $ST"
            case "$ST" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::deploy command ended in '$ST'"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$PROD_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent}'
                exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$PROD_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Smoke test
        run: |
          set -euo pipefail
          for ENDPOINT in \
            "https://eventpulse.com.bd/" \
            "https://app.eventpulse.com.bd/" \
            "https://api.eventpulse.com.bd/health"; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$ENDPOINT" || echo "000")
            echo "$ENDPOINT -> $CODE"
            test "$CODE" = "200"
          done

      - name: Notify Slack
        if: always()
        env:
          STATUS: ${{ job.status }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Production deploy ${{ env.STATUS }} — ${{ env.RELEASE_TAG }} by ${{ env.DEPLOY_ACTOR }}"
