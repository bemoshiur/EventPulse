name: CI

# Trigger model — PR validation only.
#
# Previously this workflow also fired on `push: [main, prod]`, which
# re-ran the full validation suite (~8.5 min of billable runner-time)
# AFTER a PR had already passed its `pull_request` run. Branch
# protection + the concurrency block below already cover the cases
# the post-merge run was theoretically protecting against; the
# duplicate run was pure waste (~170 min/month at recent merge cadence).
# `deploy-staging.yml`'s `push: main` trigger is the legitimate
# consumer of push-to-main and is unaffected.
on:
  pull_request:
    branches: [main, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'

# CI evolves with the codebase (CLAUDE.md §24 → "CI Evolution").
# At any point in the project's life, every check listed here must pass on
# green code. The detect-scope job below figures out which suites the current
# tree can support; suites that don't apply yet are skipped cleanly so CI
# stays green through early-sprint scaffolding and tightens as features land.
#
# Docs-only PR skip (Day-36 CI optimization):
# detect-scope computes `is_docs_only` — true iff EVERY changed file in the
# PR matches `.claude/memory/**`, `docs/**`, or `**/*.md`. Heavy jobs (lint,
# unit, api-build, integration, e2e) gate on `is_docs_only != 'true'`.
# The "every file must match" semantic is load-bearing: a PR touching
# `docs/foo.md` AND `apps/api/src/bar.ts` runs the FULL suite — the skip
# fires only when there is no runtime behaviour to validate, by construction.
# `commitlint.yml` runs in a separate workflow and is unaffected.
#
# IMPORTANT — pnpm version note:
# `pnpm/action-setup@v4` errors when both `version:` is passed AND
# `packageManager` is set in package.json. We treat `packageManager` as
# authoritative (it's the Node.js standard) and OMIT `version:` from every
# `pnpm/action-setup@v4` invocation below. Do not add it back without
# also removing the `packageManager` field — see gotchas.md
# "CI written for the finished platform fails on early-sprint codebases".

jobs:
  detect-scope:
    name: Detect testing scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_migrations: ${{ steps.check.outputs.has_migrations }}
      has_e2e: ${{ steps.check.outputs.has_e2e }}
      is_docs_only: ${{ steps.docs.outputs.is_docs_only }}
    steps:
      # `fetch-depth: 0` so the diff against the PR base ref works.
      # The default shallow fetch (depth 1) wouldn't have the base
      # commit needed to compute "what files this PR changes".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Look for schema migrations + Playwright specs
        run: |
          set -euo pipefail
          if compgen -G 'apps/api/src/db/migrations/*.sql' > /dev/null \
             || compgen -G 'apps/api/src/db/migrations/**/*.sql' > /dev/null; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Schema migrations found — integration + RLS tests will run"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No schema migrations yet — integration + RLS tests skipped"
          fi
          if compgen -G 'apps/web/e2e/**/*.spec.ts' > /dev/null \
             || compgen -G 'apps/web/e2e/*.spec.ts' > /dev/null; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Playwright specs found — e2e smoke will run"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Playwright specs yet — e2e smoke skipped"
          fi

      - id: docs
        name: Detect docs/memory-only PR
        # Computes `is_docs_only` from the PR's changed file list.
        # Patterns matched (any of):
        #   - .claude/memory/**            — session memory PRs
        #   - docs/**                       — runbooks, decisions briefs, ops drafts
        #   - **/*.md                       — README / CHANGES / playbook edits anywhere
        #
        # SAFETY (load-bearing): the check is "EVERY changed file must match".
        # A PR touching `docs/foo.md` AND `apps/api/src/bar.ts` is NOT docs-only —
        # the heavy jobs will run. The grep predicate is inverted: it counts
        # files NOT matching the patterns; iff zero non-matches, the PR is
        # docs-only. This makes the skip fail-closed on any pattern miss.
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files in this PR:"
          echo "$CHANGED"
          echo ""
          NON_DOCS=$(echo "$CHANGED" | grep -vE '^(\.claude/memory/|docs/)|\.md$' || true)
          if [ -z "$CHANGED" ]; then
            # Defensive: an empty diff (rebase artefact, force-push to same SHA)
            # should NOT skip CI — we have no evidence the change is docs-only.
            echo "is_docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Empty diff — running full CI (defensive)"
          elif [ -z "$NON_DOCS" ]; then
            echo "is_docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs/memory-only PR — heavy jobs will be skipped (lint, unit, api-build, integration, e2e)"
          else
            echo "is_docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-docs file(s) changed — running full CI:"
            echo "$NON_DOCS" | sed 's/^/  /'
          fi

  lint-and-typecheck:
    name: Lint + typecheck + format
    needs: detect-scope
    if: needs.detect-scope.outputs.is_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  dependency-audit:
    # CLAUDE.md §24.4 Sprint-4-close requirement — `pnpm audit` blocking
    # on HIGH + CRITICAL advisories. Scoped to `--prod` (production
    # dependencies only) so dev-time tooling vulnerabilities don't block
    # PRs that have no exposure at runtime — dev tooling is patched by
    # the ongoing Dependabot bump cycle on its own cadence.
    #
    # `--ignore-registry-errors` keeps CI green when the npm registry
    # has a transient outage; the gate fires only when the registry
    # actually returns a high+critical advisory list.
    #
    # Skip docs-only PRs to match other jobs. The audit reads the
    # lockfile, so it doesn't add value on a pure docs change.
    name: Dependency audit (prod, high+critical)
    needs: detect-scope
    if: needs.detect-scope.outputs.is_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies at high+critical
        run: pnpm audit --prod --audit-level high --ignore-registry-errors

  unit-tests:
    name: Unit tests
    needs: detect-scope
    if: needs.detect-scope.outputs.is_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  api-build:
    # Sprint 2 Day 13 carry. Item 5's deploy attempt 4 (PR #62) was caused
    # by `apps/api/tsconfig.build.json` inheriting `declarationMap: true`
    # from the base tsconfig — `tsc --noEmit` (typecheck) doesn't trip
    # the constraint, only the real production build does. This job runs
    # the real production build for @eventpulse/api so the next prod-only
    # foot-gun lands on a PR check, not a staging deploy retry.
    name: API production build
    needs: detect-scope
    if: needs.detect-scope.outputs.is_docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      # Workspace dep — apps/api consumes @eventpulse/shared-types from
      # its `dist/`. Without this step, the next tsc step fails because
      # dist/index.d.ts doesn't exist. Was added at Day 21 Fix 1 retry
      # (the previous source-shipping shape was the original mistake;
      # see decisions.md "shared-types real tsc build" 2026-05-19).
      - run: pnpm --filter @eventpulse/shared-types build
      - run: pnpm --filter @eventpulse/api build

  integration-tests:
    name: Integration + RLS tests
    needs: detect-scope
    if: needs.detect-scope.outputs.is_docs_only != 'true' && needs.detect-scope.outputs.has_migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventpulse
          POSTGRES_PASSWORD: eventpulse
          POSTGRES_DB: eventpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eventpulse:eventpulse@localhost:5432/eventpulse_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build workspace deps (shared-types)
        run: pnpm --filter @eventpulse/shared-types build

      - name: Apply migrations
        run: pnpm --filter @eventpulse/api db:migrate

      - name: Seed Buyer-Terms-Lite v1.0
        # Day 39 Phase 2 wire-in: the buyer-form integration tests assert
        # a consent_records row is written, which requires the
        # legal_documents + legal_document_versions rows for buyer-terms
        # v1.0 to exist. Idempotent — re-running against an already-seeded
        # DB is a no-op.
        run: pnpm --filter @eventpulse/api db:seed:buyer-terms-v1

      - name: Integration + RLS tests
        run: pnpm --filter @eventpulse/api test

  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: detect-scope
    if: needs.detect-scope.outputs.is_docs_only != 'true' && needs.detect-scope.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres service container added at Day 21 Fix 6 — the DB-aware
    # /health endpoint (apps/api/src/app.ts) now does a `SELECT 1` against
    # the DB on every probe, and Playwright's `webServer.url` waits for
    # /health to return 200 before running tests. Without DATABASE_URL,
    # /health returns 503 → 120s webserver timeout → e2e job fails.
    # Mirrors the integration-tests job's service setup exactly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventpulse
          POSTGRES_PASSWORD: eventpulse
          POSTGRES_DB: eventpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eventpulse:eventpulse@localhost:5432/eventpulse_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm --filter @eventpulse/web exec playwright install --with-deps chromium

      - name: Build workspace deps (shared-types)
        run: pnpm --filter @eventpulse/shared-types build

      - name: Apply migrations
        # Required for DB-aware /health to succeed — the api needs the
        # eventpulse_app / eventpulse_admin roles + table grants from
        # the migration set before `withSuperAdmin(SELECT 1)` works.
        run: pnpm --filter @eventpulse/api db:migrate

      - run: pnpm --filter @eventpulse/web build

      - name: Run Playwright smoke
        run: pnpm --filter @eventpulse/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
