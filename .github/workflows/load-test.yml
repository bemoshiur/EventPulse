name: Load test (k6 staging)

# Posture (Day 43 scaffold):
#   workflow_dispatch only — operator-triggered, NOT a PR gate yet.
#
# Once the operator baselines budgets.json (see
# infra/load-tests/README.md), they flip this `on:` block to add
# `pull_request: { branches: [main] }` and the gate becomes blocking.
#
# This matches the build-track-owns-drafts pattern (decisions.md
# 2026-05-26 Day-35): drafts that need an operator-only baseline don't
# get auto-enabled.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (e.g. https://api.staging.eventpulse.com.bd)'
        type: string
        required: true
        default: 'https://api.staging.eventpulse.com.bd'

permissions:
  contents: read

jobs:
  load-test:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          set -euo pipefail
          # Install k6 from the official APT repo for the latest stable.
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      # `inputs.base_url` is workflow_dispatch input — authorised users only,
      # but kept out of run-scripts entirely. Passed as env var per the
      # workflow-injection guidance; k6 reads it via __ENV.BASE_URL.
      - name: Run k6 load test
        working-directory: infra/load-tests
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: k6 run events-list.js

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: infra/load-tests/load-test-results.json
          retention-days: 14

      - name: Compare against budgets
        working-directory: infra/load-tests
        run: |
          set -euo pipefail
          if [ ! -f load-test-results.json ]; then
            echo "::error::Expected load-test-results.json from k6 not found"
            exit 1
          fi

          python3 <<'PY'
          import json, sys

          with open('budgets.json') as f: budgets = json.load(f)
          with open('load-test-results.json') as f: results = json.load(f)

          thr = budgets['_thresholds_per_24_4']
          p95_max_regress_pct = thr['p95_regression_max_pct']
          err_abs_max_pct = thr['error_rate_absolute_increase_max_pct']

          failed = False
          unbaselined = False

          for scenario_name, scenario_results in results['scenarios'].items():
              budget = budgets.get(scenario_name)
              if not budget:
                  print(f'::warning::No budget defined for scenario {scenario_name}; skipping')
                  continue

              budget_p95 = budget['p95_ms']
              budget_err = budget['error_rate_pct']

              observed_p95 = scenario_results['p95_ms']
              observed_err = scenario_results['error_rate_pct']

              print(f'')
              print(f'=== {scenario_name} ===')
              print(f'  p95:    observed={observed_p95:.0f}ms  budget={budget_p95}ms  (cap={budget_p95*(1+p95_max_regress_pct/100):.0f}ms)')
              print(f'  errors: observed={observed_err:.2f}%   budget={budget_err}%   (cap={budget_err+err_abs_max_pct}%)')

              if budget_p95 == 0:
                  print(f'::warning::{scenario_name} has no p95 baseline (p95_ms=0 in budgets.json) — assertion skipped. Operator must run baseline + update budgets.json. See infra/load-tests/README.md.')
                  unbaselined = True
                  continue

              p95_cap = budget_p95 * (1 + p95_max_regress_pct / 100.0)
              if observed_p95 > p95_cap:
                  print(f'::error::{scenario_name} p95 {observed_p95:.0f}ms exceeds cap {p95_cap:.0f}ms (budget {budget_p95}ms + {p95_max_regress_pct}% regress)')
                  failed = True

              err_cap = budget_err + err_abs_max_pct
              if observed_err > err_cap:
                  print(f'::error::{scenario_name} error rate {observed_err:.2f}% exceeds cap {err_cap}% (budget {budget_err}% + {err_abs_max_pct} bps absolute)')
                  failed = True

          if failed:
              sys.exit(1)
          elif unbaselined:
              print('')
              print('::notice::All scenarios in scaffold mode (no baseline). Operator must baseline before this workflow can gate PRs.')
              sys.exit(0)
          else:
              print('')
              print('All scenarios passed budget checks.')
              sys.exit(0)
          PY
