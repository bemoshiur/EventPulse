name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy main → staging EC2
    # Set `STAGING_DEPLOY_ENABLED=true` as a repo variable once the Day 9-10
    # infra/deploy/deploy.sh + AWS OIDC role + EC2 instance id are in place.
    # Until then the workflow is a no-op on every push to main.
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.eventpulse.com.bd
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_ACTOR: ${{ github.actor }}
      STAGING_INSTANCE_ID: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_STAGING }}
          aws-region: ap-southeast-1
          role-session-name: gh-actions-deploy-staging

      - name: Trigger deploy script via SSM
        id: ssm
        run: |
          set -euo pipefail
          # DEPLOY_SHA is a 40-char hex SHA from GitHub, no shell metacharacters,
          # but we still keep it in the env var rather than interpolating into yaml.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy-staging $DEPLOY_SHA" \
            --parameters "commands=[\"sudo -u eventpulse /home/eventpulse/app/infra/deploy/deploy.sh $DEPLOY_SHA\"]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for SSM command
        env:
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$STAGING_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$STAGING_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Smoke test
        run: |
          set -euo pipefail
          for ENDPOINT in \
            "https://staging.eventpulse.com.bd/" \
            "https://app.staging.eventpulse.com.bd/" \
            "https://api.staging.eventpulse.com.bd/health"; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$ENDPOINT" || echo "000")
            echo "$ENDPOINT -> $CODE"
            test "$CODE" = "200"
          done

      - name: Notify Slack
        if: always()
        env:
          STATUS: ${{ job.status }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Staging deploy ${{ env.STATUS }} — ${{ env.DEPLOY_SHA }} by ${{ env.DEPLOY_ACTOR }}"
