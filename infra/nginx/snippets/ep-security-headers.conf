# Event Pulse — security response headers (Day 42 audit, restored to repo from staging).
#
# Captured from the live `/etc/nginx/snippets/ep-security-headers.conf` on the
# staging EC2 at 2026-06-01 during the §7 security checklist sweep of the
# launch-readiness runbook. The file existed on the deploy target but not in
# git; restoring here so future deploys keep the source-of-truth in this repo.
#
# Bootstrap symlinks `/etc/nginx/snippets/ep-security-headers.conf` →
# `<repo>/infra/nginx/snippets/ep-security-headers.conf`. Edits to this file
# take effect on `nginx -s reload` (or deploy.sh's vhost-reload path).
#
# Header rationale:
#
# - X-Content-Type-Options: nosniff
#     Disables MIME sniffing on responses; mandatory for any surface that
#     serves user-uploaded content (KYC docs via signed URLs are NOT served
#     through Nginx — they're presigned S3 URLs — but the default applies
#     to every response from this server anyway).
#
# - X-Frame-Options: DENY
#     Blocks iframe embedding entirely. Stronger than SAMEORIGIN since none
#     of Event Pulse's surfaces deliberately embed others. Tenant landing
#     pages render directly, not framed.
#
# - Referrer-Policy: strict-origin-when-cross-origin
#     Same-origin requests get the full referrer; cross-origin requests
#     get only the origin. Matches modern browser defaults; explicit so
#     we don't depend on browser-default drift.
#
# - Permissions-Policy: interest-cohort=()
#     Opts out of Google Topics/FLoC. We do not participate in interest-
#     based advertising APIs.
#
# - Strict-Transport-Security: max-age=31536000; includeSubDomains
#     One-year HSTS; includes all `*.eventpulse.com.bd` subdomains. NOT
#     `preload` — deliberate choice: preload is hard to undo (multi-week
#     browser propagation when removed). Revisit once revenue justifies
#     the operational risk.
#
# Headers we DO NOT set:
#
# - Content-Security-Policy: complex to author correctly without breaking
#     legitimate Next.js inline-script bootstrapping; deferred to a focused
#     CSP-only PR post-launch.
# - X-XSS-Protection: deprecated by modern browsers; intentionally omitted.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
