# Event Pulse — common reverse-proxy headers (Day 42 audit, restored to repo from staging).
#
# Captured from the live `/etc/nginx/snippets/ep-proxy-headers.conf` on the
# staging EC2 at 2026-06-01 during the §7 security checklist sweep of the
# launch-readiness runbook. The file existed on the deploy target but not in
# git; restoring here so future deploys keep the source-of-truth in this repo.
#
# Bootstrap symlinks `/etc/nginx/snippets/ep-proxy-headers.conf` →
# `<repo>/infra/nginx/snippets/ep-proxy-headers.conf`.
#
# Why each setting:
#
# - proxy_http_version 1.1
#     Required for `Upgrade: websocket` requests AND for keep-alive
#     reuse against the Node upstreams (default 1.0 breaks both).
#
# - proxy_set_header Host $host
#     Preserves the request Host header so Next.js middleware can
#     discriminate apex / `app.` / `admin.` / `my.` / tenant-subdomain
#     hosts (§7.5 routing).
#
# - X-Real-IP + X-Forwarded-For + X-Forwarded-Proto
#     Standard reverse-proxy provenance. The api reads X-Forwarded-For
#     to source the client IP for rate-limit keys + audit_logs.ip.
#
# - Upgrade + Connection
#     WebSocket upgrade pass-through. Not used in Phase 1 but harmless.
#
# - proxy_read_timeout 75s
#     Allows long-running server actions (e.g. EPS verify with sandbox
#     latency) to complete; Next.js streaming responses also benefit.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_read_timeout 75s;
