# Event Pulse — PRODUCTION Nginx vhost.
#
# Prod analog of eventpulse-staging.conf for the §17.6 production hostname
# set. Routes by Host:
#
#   eventpulse.com.bd (apex), www, app, admin, my, customers,
#   *.eventpulse.com.bd (tenant subdomains)   →  Next.js at 127.0.0.1:3000
#   api.eventpulse.com.bd                      →  Hono   at 127.0.0.1:4000
#
# TLS: one Let's Encrypt cert with 2 SANs — `eventpulse.com.bd` (apex) +
# `*.eventpulse.com.bd` (wildcard) — issued via DNS-01 in cutover sub-item
# #3 (§17.7). Live dir is named after the first -d: /etc/letsencrypt/live/
# eventpulse.com.bd/.
#
# nginx precedence note: an EXACT server_name (api.eventpulse.com.bd) wins
# over a leading-wildcard server_name (*.eventpulse.com.bd), so api traffic
# reaches :4000 even though the wildcard block also matches the name.
#
# Installed at: /etc/nginx/sites-enabled/eventpulse-prod.conf (symlink by
# bootstrap-prod.sh). nginx -t will fail until the cert exists (#3).

# ─── HTTP → HTTPS redirect + ACME challenge ─────────────────────────────
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name eventpulse.com.bd
              www.eventpulse.com.bd
              app.eventpulse.com.bd
              admin.eventpulse.com.bd
              my.eventpulse.com.bd
              api.eventpulse.com.bd
              customers.eventpulse.com.bd
              *.eventpulse.com.bd;

  location /.well-known/acme-challenge/ {
    root /var/www/eventpulse;
  }

  return 301 https://$host$request_uri;
}

# ─── api.eventpulse.com.bd → Hono on :4000 ──────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.eventpulse.com.bd;

  ssl_certificate     /etc/letsencrypt/live/eventpulse.com.bd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/eventpulse.com.bd/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/snippets/ep-security-headers.conf;

  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  client_max_body_size 25M;  # OAuth callbacks + KYC uploads

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ─── web hostnames → Next.js on :3000 ───────────────────────────────────
# apex + www + app + admin + my + customers + every tenant subdomain.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name eventpulse.com.bd
              www.eventpulse.com.bd
              app.eventpulse.com.bd
              admin.eventpulse.com.bd
              my.eventpulse.com.bd
              customers.eventpulse.com.bd
              *.eventpulse.com.bd;

  ssl_certificate     /etc/letsencrypt/live/eventpulse.com.bd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/eventpulse.com.bd/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/snippets/ep-security-headers.conf;

  # Optional admin IP allowlist (§17.4). Left OPEN by default — the
  # super-admin JWT (aud=super-admin) is the real security boundary, and a
  # wrong/empty allowlist would lock out legitimate admin access. To enable,
  # uncomment + set the operator's static IP(s), and move admin. to its own
  # server block (an allowlist here would also gate the public apex/tenant
  # pages, which must stay open).

  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
