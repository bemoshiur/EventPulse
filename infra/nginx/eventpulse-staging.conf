# Event Pulse — staging Nginx vhost.
#
# CLAUDE.md §17.4 describes the production-target vhost shape (one file
# per subdomain). For staging MVP we collapse them into a single vhost
# that routes by Host:
#
#   staging., app., admin., my.    →  Next.js at 127.0.0.1:3000
#   api.                            →  Hono at  127.0.0.1:4000
#
# Each subdomain still gets the same TLS cert (5 SANs issued by certbot
# per CLAUDE.md §17.7), the same HTTP→HTTPS redirect, and the same
# /health Nginx-direct probe so the SSM auto-rollback in deploy.sh can
# distinguish nginx-up-app-down from nginx-down.
#
# Installed at: /etc/nginx/sites-enabled/eventpulse-staging.conf
# Reload via:   sudo nginx -t && sudo systemctl reload nginx
#
# Update flow: this file is the source of truth. bootstrap-staging.sh
# symlinks /etc/nginx/sites-enabled/eventpulse-staging.conf to this
# file (so future repo updates propagate via `git pull` + `nginx -s
# reload`, no manual file copy).

# ─── HTTP → HTTPS redirect + ACME challenge ─────────────────────────────
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name staging.eventpulse.com.bd
              app.staging.eventpulse.com.bd
              admin.staging.eventpulse.com.bd
              api.staging.eventpulse.com.bd
              my.staging.eventpulse.com.bd;

  # Let's Encrypt http-01 challenge fallback (we use dns-01 in §17.7
  # but keep the http-01 path open in case of operator-initiated
  # certbot --webroot runs).
  location /.well-known/acme-challenge/ {
    root /var/www/eventpulse;
  }

  return 301 https://$host$request_uri;
}

# ─── api.staging.eventpulse.com.bd → Hono on :4000 ──────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.staging.eventpulse.com.bd;

  ssl_certificate     /etc/letsencrypt/live/staging.eventpulse.com.bd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.eventpulse.com.bd/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/snippets/ep-security-headers.conf;

  # /nginx-health — Nginx-direct liveness probe. Distinguishes
  # "nginx-up-app-down" from "everything-down" for external monitoring.
  # Returns plain `ok` literally from Nginx; does NOT touch the upstream.
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # /health — proxied through to the Hono app's /health endpoint, which
  # exercises the DB connection and returns 503 if Postgres is unreachable
  # (Fix 6 of the Day 21 verification deploy sequence). Previously this
  # location was a static `return 200 "ok\n"` literal that masked api
  # crash-loops from external probes — the 4-day silent failure that the
  # Sprint 2 silent-partial-failure gotcha consolidates.

  client_max_body_size 25M;  # OAuth callbacks + future KYC uploads

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ─── web subdomains → Next.js on :3000 ──────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name staging.eventpulse.com.bd
              app.staging.eventpulse.com.bd
              admin.staging.eventpulse.com.bd
              my.staging.eventpulse.com.bd;

  ssl_certificate     /etc/letsencrypt/live/staging.eventpulse.com.bd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.eventpulse.com.bd/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/snippets/ep-security-headers.conf;

  # /nginx-health — same Nginx-direct liveness probe as the api vhost.
  # Web routes don't have a /health endpoint in Next.js; /health on web
  # subdomains now passes through to Next.js (which returns 404).
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Next.js static assets — long-cache aggressively.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js sends an upgrade header for fast-refresh in dev; harmless
    # in prod and lets WebSocket-using features just work later.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
