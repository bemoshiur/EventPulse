  - generic [ref=e159]:
    - heading "About the rate shown above" [level=3] [ref=e160]
    - paragraph [ref=e161]: The calculator above uses the v1.0 launch bKash rate (2.0% on capture). Card, Nagad, Rocket, and Upay rates publish when those methods join post-launch.
    - paragraph [ref=e162]: উপরের ক্যালকুলেটরটি v1.0 লঞ্চের bKash রেট (২.০%) ব্যবহার করছে। কার্ড / নগদ / রকেট / উপয় রেট লঞ্চ-পরবর্তী যখন সেই পদ্ধতিগুলো যোগ হবে তখন প্রকাশিত হবে।
  - generic [ref=e164]:
    - generic [ref=e165]:
      - paragraph [ref=e166]: Questions
      - heading "Pricing FAQ" [level=2] [ref=e167]
    - generic [ref=e168]:
      - generic [ref=e169]:
        - heading "What does “pass-through” mean?" [level=3] [ref=e170]
        - paragraph [ref=e171]: The fee is added on top of the ticket price at checkout. The buyer sees it as a separate line item. You receive the full face value at settlement.
      - generic [ref=e172]:
        - heading "What does “absorb” mean?" [level=3] [ref=e173]
        - paragraph [ref=e174]: The fee is deducted from the ticket price. The buyer sees one clean number. You receive the face value minus the absorbed fee at settlement.
      - generic [ref=e175]:
        - heading "Do free events cost anything?" [level=3] [ref=e176]
        - paragraph [ref=e177]: No. Free events pay no platform fee and no gateway fee, because no money moves. You can run unlimited free events with no KYC.
      - generic [ref=e178]:
        - heading "When do I get paid?" [level=3] [ref=e179]
        - paragraph [ref=e180]: T+5 business days. Net proceeds settle to your bank account at launch. bKash, Nagad, Rocket, and Upay payout adapters arrive in Phase 2.
      - generic [ref=e181]:
        - heading "Are there volume discounts?" [level=3] [ref=e182]
        - paragraph [ref=e183]: For enterprise customers running consistent high-volume events, contact support. Default for everyone is the flat 0.25%.
      - generic [ref=e184]:
        - heading "What about VAT and withholding?" [level=3] [ref=e185]
        - paragraph [ref=e186]: VAT (15%) applies to our service fee per NBR. Withholding (AIT) on payouts is handled per your tax status and documented on every disbursement.
  - generic [ref=e188]:
    - heading "Sign up and ship your first event." [level=2] [ref=e189]
    - paragraph [ref=e190]: Free events publish in under 90 seconds. Paid events graduate through KYC before tickets go on sale.
    - link "Get started" [ref=e192] [cursor=pointer]:
      - /url: /sign-up
