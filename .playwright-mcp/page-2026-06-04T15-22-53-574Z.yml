  - generic [ref=e46]:
    - generic [ref=e47]:
      - paragraph [ref=e48]: The organiser’s headache
      - heading "Selling tickets in Bangladesh is harder than the event itself." [level=2] [ref=e49]
      - paragraph [ref=e50]: The work that drains your team isn’t the show — it’s everything around the ticket. Here’s what we replace.
    - generic [ref=e51]:
      - generic [ref=e52]:
        - heading "Registration lives in spreadsheets." [level=3] [ref=e53]
        - paragraph [ref=e54]: রেজিস্ট্রেশন স্প্রেডশিটে আটকে
        - paragraph [ref=e55]: Google Forms for sign-ups, bKash screenshots for payment, a WhatsApp group for the guest list. Reconciling who actually paid eats the days you needed for the event itself.
      - generic [ref=e56]:
        - heading "Money moves through personal accounts." [level=3] [ref=e57]
        - paragraph [ref=e58]: টাকা চলে ব্যক্তিগত অ্যাকাউন্টে
        - paragraph [ref=e59]: Collections land in someone’s personal bKash with no audit trail, no settlement schedule, and no clean way to split fees or refund a buyer. Trust breaks before the event starts.
      - generic [ref=e60]:
        - heading "The gate is chaos. Tickets get faked." [level=3] [ref=e61]
        - paragraph [ref=e62]: গেটে বিশৃঙ্খলা, ভুয়া টিকিট
        - paragraph [ref=e63]: Screenshot “tickets” get forwarded and reused. Volunteers check names against a printed list while a queue builds. You have no idea who showed up until it’s over.
  - generic [ref=e65]:
    - generic [ref=e66]:
      - paragraph [ref=e67]: One platform, end to end
      - heading "Everything from the first ticket to the final payout." [level=2] [ref=e68]
    - generic [ref=e69]:
      - generic [ref=e70]:
        - paragraph [ref=e71]: Sell anywhere
        - heading "Branded pages. Custom forms. Your domain." [level=3] [ref=e72]
        - paragraph [ref=e73]: Spin up a beautiful event page with your logo and colours, design the exact registration form you need — text, NID, file upload, conditional logic — and put it on your own domain. Share one link, sell everywhere.
      - generic [ref=e74]:
        - paragraph [ref=e75]: Run with your team
        - heading "Roles, an attendee CRM, and a web check-in scanner." [level=3] [ref=e76]
        - paragraph [ref=e77]: Invite your team with the right access — owner, editor, scanner, finance. Search and export attendees. At the gate, scan QR tickets from any phone browser; every check-in is instant and de-duplicated.
      - generic [ref=e78]:
        - paragraph [ref=e79]: Get paid safely
        - heading "EPS checkout, escrow, and automated T+5 payouts." [level=3] [ref=e80]
        - paragraph [ref=e81]: Buyers pay through EPS hosted checkout — never a personal wallet. Funds sit in escrow, and net proceeds settle to your bank or MFS account five business days after each sale. Refunds and reconciliation are built in.
